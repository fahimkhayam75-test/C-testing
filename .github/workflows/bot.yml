name: paper-bot
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: paper-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bot (scans every minute for ~5.5 hours)
        run: |
          git config user.name "paper-bot"
          git config user.email "bot@users.noreply.github.com"
          save() {
            python3 paper_bot.py report > REPORT.txt || true
            git add state_v3.json trades_v3.csv REPORT.txt 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "update" -q
              git pull --rebase --autostash -q || true
              git push -q || true
            fi
          }
          END=$((SECONDS + 19800))
          n=0
          while [ $SECONDS -lt $END ]; do
            python3 paper_bot.py once || true
            n=$((n + 1))
            if [ $((n % 10)) -eq 0 ]; then save; fi
            sleep 60
          done
          save
