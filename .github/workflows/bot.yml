name: paper-bot
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-bot
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 paper_bot.py once
      - run: python3 paper_bot.py report | tee REPORT.txt
      - name: Save state
        run: |
          git config user.name "paper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json trades.csv REPORT.txt || true
          git diff --cached --quiet || (git commit -m "update" && git push)
